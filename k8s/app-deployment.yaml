apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-demo-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-demo
  template:
    metadata:
      labels:
        app: springboot-demo
    spec:
      containers:
      - name: springboot-demo-container
        image: devops-practice/springboot-demo:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-demo-service
spec:
  type: NodePort
  selector:
    app: springboot-demo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30001
